[project]
name = "myfirstrag"
version = "0.1.0"
description = "RAG educativo con LangChain, ChromaDB y Streamlit"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.23",
    "ipykernel>=7.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langchain[openai]>=1.4.3",
    "numpy>=2.5.3",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
]

[project.scripts]
myfirstrag = "myfirstrag:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
